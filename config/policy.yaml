# Authorization policy. Tokens are stored only as SHA-256 hashes.
# The three tokens below are DEVELOPMENT tokens documented in the README;
# replace them (or swap PolicyTokenVerifier for your IdP's JWT verifier) before any real use.

tokens:
  - client_id: research-agent          # token: dev-research-token
    token_sha256: 669b5310cb56b25130bc08f0d4d4054b32dc9fb976bcedcfdb17b955e8bd6093
    scopes: [search_docs, rag_answer]
  - client_id: readonly-agent          # token: dev-readonly-token
    token_sha256: a91e970ba6ba154be9a86febe073a511fc3bbd3c069dfb7d9a10e1acddb2bc8d
    scopes: [search_docs]
  - client_id: auditor                 # token: dev-auditor-token
    token_sha256: 98cf681f2a5cde03b61e87f21f50956519de249c09b0b0c5af316ce8ddd861a7
    scopes: [audit_status]

# Every tool must be listed here; unlisted tools are denied for everyone.
tools:
  search_docs: {scope: search_docs}
  rag_answer: {scope: rag_answer}
  audit_status: {scope: audit_status}
